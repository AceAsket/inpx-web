<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подготовка каталога · INPX Web</title>
<noscript><meta http-equiv="refresh" content="5"></noscript>
<style>
  :root {color-scheme:light dark;font:16px/1.5 system-ui,sans-serif}
  body {margin:0;padding:clamp(24px,8vh,90px) 20px}
  main {max-width:36rem;margin:auto}
  h1 {font-size:clamp(1.45rem,5vw,2rem);line-height:1.2}
  progress {width:100%;height:0.7rem;accent-color:#178278}
  dl {display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem}
  dd {margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  [hidden] {display:none}
</style>
<main>
  <h1 id="title">Подготовка каталога</h1>
  <p id="phase" role="status">Открытие каталога</p>
  <progress id="progress" aria-labelledby="phase"></progress>
  <dl>
    <dt hidden>Библиотека</dt><dd hidden id="source"></dd>
    <dt hidden>Обработано записей</dt><dd hidden id="records"></dd>
    <dt hidden>Части библиотеки</dt><dd hidden id="parts"></dd>
    <dt hidden>Прошло времени</dt><dd hidden id="elapsed"></dd>
  </dl>
  <p>Каталог откроется автоматически.</p>
</main>
<script>
  const poll = new URL(location.href);
  poll.search = 'inpxStartupStatus=1';
  poll.hash = '';
  const numbers = new Intl.NumberFormat('ru');
  const count = (value, total) => Number.isFinite(value)
    ? numbers.format(value) + (total > 0 ? ' из ' + numbers.format(total) : '') : '';
  function field(id, value) {
    const el = document.getElementById(id);
    el.textContent = value;
    el.hidden = el.previousElementSibling.hidden = !value;
  }
  async function update() {
    try {
      const response = await fetch(poll,{cache:'no-store'});
      if (!response.ok) throw new Error();
      const state = await response.json();
      if (state.ready) { location.reload(); return; }
      document.getElementById('title').textContent = state.migration ? 'Перенос каталога на Rust' : 'Подготовка каталога';
      document.getElementById('phase').textContent = state.jobMessage;
      field('source',state.sourceName || '');
      field('records',count(state.recsLoaded,state.totalRecords));
      field('parts',count(state.current,state.totalFiles));
      const seconds = state.elapsedSeconds;
      field('elapsed',Math.floor(seconds / 60) + ' мин ' + seconds % 60 + ' с');
      const bar = document.getElementById('progress');
      if (state.totalFiles > 0) { bar.max = state.totalFiles; bar.value = state.current || 0; }
      else if (state.totalRecords > 0) { bar.max = state.totalRecords; bar.value = state.recsLoaded || 0; }
      else bar.removeAttribute('value');
    } catch {
      document.getElementById('phase').textContent = 'Ожидание соединения с сервером…';
    }
    setTimeout(update,1500);
  }
  update();
</script>
</html>
