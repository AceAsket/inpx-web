[package]
name = "inpx-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
ctutils = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
html-escape = "0.3"
hmac = "0.13"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
inpx-auth-state = { path = "../auth-state" }
inpx-catalog = { path = "../catalog" }
mail-send = { version = "0.6.1", default-features = false, features = ["ring", "tls12"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2.5"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "socks", "stream"] }
scraper = { version = "0.24", default-features = false }
smtp-proto = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[build-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
