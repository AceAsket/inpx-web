[package]
name = "inpx-catalog"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aws-lc-sys = { version = "0.47", features = ["prebuilt-nasm"] }
base64 = "0.22"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
html-escape = "0.3"
icu_collator = "2"
icu_locale_core = "2"
inpx-auth-state = { path = "../auth-state" }
indexmap = { version = "2", features = ["serde"] }
inpx-reader = { path = "../inpx" }
log = "0.4"
memchr = "2"
once_cell = "1"
quick-xml = "0.42"
redb = "4"
percent-encoding = "2"
regex = "1"
rquickjs = "0.14.0"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["deflate", "ppmd"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", default-features = false, features = ["formatting", "large-dates", "parsing"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "ppmd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = { version = "0.1", default-features = false }
