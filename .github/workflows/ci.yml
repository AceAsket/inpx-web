name: Validate development changes

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_only:
        description: Run browser checks without rebuilding platform binaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-catalog:
    name: Rust reader and catalog
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.browser_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.100.0 fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo +1.100.0 clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.100.0 test --manifest-path rust/Cargo.toml --locked --release
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cargo +1.100.0 build --manifest-path rust/Cargo.toml --locked --release -p inpx-catalog -p inpx-server
      - run: node scripts/rust-http-tests.js rust/target/release/inpx-server
      - run: node scripts/rust-opds-http-tests.js rust/target/release/inpx-server
      - run: node scripts/rust-download-http-tests.js rust/target/release/inpx-server
      - run: |
          if ! command -v 7z && ! command -v 7zz; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends p7zip-full
          fi
          node scripts/rust-book-archive-tests.js rust/target/release/inpx-catalog
          node scripts/rust-book-prepare-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-book-cache-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-book-export-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-book-metadata-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-kosync-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-catalogue-lock-tests.js rust/target/release/inpx-catalog
      - run: rustup target add wasm32-unknown-unknown --toolchain 1.100.0
      - run: cargo +1.100.0 build --manifest-path rust/Cargo.toml --locked --release --target wasm32-unknown-unknown -p inpx-auth-state
      - run: node scripts/rust-auth-state-tests.js rust/target/wasm32-unknown-unknown/release/inpx_auth_state.wasm
      - run: node scripts/rust-jemba-compat-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-web-access-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-progress-journal-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-backup-archive-tests.js rust/target/release/inpx-catalog
      - run: node scripts/rust-credentials-tests.js rust/target/release/inpx-catalog

  browser-ui:
    name: Library and reader UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - run: node scripts/library-appearance-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/catalog-ui
      - run: node scripts/telegram-status-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/telegram-status-ui
      - run: node scripts/profile-toolbar-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/profile-toolbar-ui
      - run: node scripts/performance-panel-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/performance-panel-ui
      - run: node scripts/overview-suggestions-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/overview-suggestions-ui
      - run: node scripts/book-preview-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/book-preview-ui
      - run: node scripts/ebook-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/ebook-ui
      - run: node scripts/reader-footer-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/reader-footer-ui
      - run: node scripts/rc13-profile-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/rc13-profile
      - run: node scripts/catalog-discovery-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/catalog-discovery-ui
      - run: node scripts/review-progress-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/review-progress-ui
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-ui-screenshots
          path: |
            ${{ runner.temp }}/catalog-ui/*.png
            ${{ runner.temp }}/telegram-status-ui/*.png
            ${{ runner.temp }}/telegram-status-ui/result.json
            ${{ runner.temp }}/reader-footer-ui/*.png
            ${{ runner.temp }}/reader-footer-ui/result.json
            ${{ runner.temp }}/catalog-ui/result.json
            ${{ runner.temp }}/catalog-discovery-ui/*.png
            ${{ runner.temp }}/catalog-discovery-ui/result.json
            ${{ runner.temp }}/rc13-profile/*.png
            ${{ runner.temp }}/rc13-profile/result.json
            ${{ runner.temp }}/profile-toolbar-ui/*.png
            ${{ runner.temp }}/performance-panel-ui/*.png
            ${{ runner.temp }}/performance-panel-ui/result.json
            ${{ runner.temp }}/overview-suggestions-ui/*.png
            ${{ runner.temp }}/overview-suggestions-ui/result.json
            ${{ runner.temp }}/book-preview-ui/*.png
            ${{ runner.temp }}/book-preview-ui/result.json
            ${{ runner.temp }}/ebook-ui/*.png
            ${{ runner.temp }}/ebook-ui/result.json
            ${{ runner.temp }}/review-progress-ui/*.png
            ${{ runner.temp }}/review-progress-ui/result.json
  validate:
    name: Test and package ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || !inputs.browser_only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            extension: ''
          - os: windows-latest
            target: win
            extension: .exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:release
      - run: npm run test:tts
      - name: Build Rust HTTP server and authentication state
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.100.0 build --manifest-path rust/Cargo.toml --locked --release --target wasm32-unknown-unknown -p inpx-auth-state
          cargo +1.100.0 build --manifest-path rust/Cargo.toml --locked --release -p inpx-server -p inpx-catalog -p inpx-reader
      - run: npm run build:${{ matrix.target }}
      - name: Test extracted release application and permissions
        env:
          INPX_SMOKE_REQUIRE_RUST_HTTP: 'true'
          INPX_SMOKE_REQUIRE_RUST_CATALOG: 'true'
        shell: bash
        run: |
          node build/release.js ${{ matrix.target }}
          version=$(node -p "require('./package.json').version")
          node scripts/release-archive-smoke-test.js ${{ matrix.target }} "dist/release/inpx-web-$version-${{ matrix.target }}.zip" --application-only
      - if: matrix.target == 'linux'
        run: docker build --target runtime-lite -t inpx-web:ci .
      - if: matrix.target == 'linux'
        run: node scripts/binary-smoke-test.js --image inpx-web:ci
        env:
          INPX_SMOKE_REQUIRE_RUST_HTTP: 'true'
          INPX_SMOKE_REQUIRE_RUST_CATALOG: 'true'
      - name: Build full image with static MOBI converter
        if: matrix.target == 'linux'
        run: docker build --target runtime -t inpx-web:ci-full .
      - name: Test real image converters
        if: matrix.target == 'linux'
        run: bash scripts/test-image-converters.sh inpx-web:ci-full
