name: Validate development changes

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_only:
        description: Run browser checks without rebuilding platform binaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui:
    name: Classic and shelves UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - run: node scripts/library-appearance-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/catalog-ui
      - run: node scripts/profile-toolbar-browser-test.js
      - run: node scripts/rc13-profile-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/rc13-profile
      - run: node scripts/catalog-discovery-browser-test.js
        env:
          INPX_ARTIFACT_DIR: ${{ runner.temp }}/catalog-discovery-ui
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-ui-screenshots
          path: |
            ${{ runner.temp }}/catalog-ui/*.png
            ${{ runner.temp }}/catalog-ui/result.json
            ${{ runner.temp }}/catalog-discovery-ui/*.png
            ${{ runner.temp }}/catalog-discovery-ui/result.json
            ${{ runner.temp }}/rc13-profile/*.png
            ${{ runner.temp }}/rc13-profile/result.json
  validate:
    name: Test and package ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || !inputs.browser_only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            extension: ''
          - os: windows-latest
            target: win
            extension: .exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:release
      - run: npm run test:tts
      - run: npm run build:${{ matrix.target }}
      - run: node scripts/binary-smoke-test.js dist/${{ matrix.target }}/inpx-web${{ matrix.extension }}
      - if: matrix.target == 'linux'
        run: docker build --target runtime-lite -t inpx-web:ci .
      - if: matrix.target == 'linux'
        run: node scripts/binary-smoke-test.js --image inpx-web:ci
      - name: Build full image with static MOBI converter
        if: matrix.target == 'linux'
        run: docker build --target runtime -t inpx-web:ci-full .
      - name: Test real image converters
        if: matrix.target == 'linux'
        run: bash scripts/test-image-converters.sh inpx-web:ci-full
