name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or ref to build'
        required: true
        default: 'v2.0.5-rc.1'
      publish:
        description: 'Publish the built artifacts as a GitHub Release'
        type: boolean
        default: true
      windows_only:
        description: 'Rebuild only the Windows artifacts for the selected tag'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_TOKEN: ${{ github.token }}
  FB2CNG_VERSION: v2.1.1

jobs:
  release-smoke-tests:
    name: Release smoke tests
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.include }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the Rust release version
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          node -e "const v=require('./package.json').version; if (parseInt(v)<2 || (process.env.PUBLISH==='true' && process.env.RELEASE_REF!=='v'+v)) throw Error('Expected a matching Rust release tag')"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run release smoke tests
        run: npm run test:release

      - name: Run TTS tests
        run: npm run test:tts

      - name: Run Rust unit tests
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 test --manifest-path rust/Cargo.toml --locked --release

      - name: Select release platforms
        id: platforms
        env:
          WINDOWS_ONLY: ${{ inputs.windows_only }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const platforms = [
            {os: 'windows-latest', label: 'Windows x64', target: 'win'},
            {os: 'ubuntu-latest', label: 'Linux x64', target: 'linux', fbc_asset: 'fbc-linux-amd64.zip',
              fbc_sha256: 'd366b672866a052c87f5b86604969b84da84830ef187b22fb836494762f5c6b8'},
            {os: 'ubuntu-24.04-arm', label: 'Linux arm64', target: 'linux-arm64', fbc_asset: 'fbc-linux-arm64.zip',
              fbc_sha256: '6c2d565aee583402179a3434fd605acaefad2925b0ba57d96dc85cc3f68f44bc'},
            {os: 'macos-15-intel', label: 'macOS x64', target: 'macos', fbc_asset: 'fbc-darwin-amd64.zip',
              fbc_sha256: '585d19dab8986c8a1ee241f4bbd0f274da3c1aa5989d641becb96b7a0484348c'},
          ];
          const selected = process.env.WINDOWS_ONLY === 'true' ? platforms.filter(platform => platform.target === 'win') : platforms;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `include=${JSON.stringify(selected)}\n`);
          NODE

  build:
    name: Build ${{ matrix.label }}
    needs: release-smoke-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-smoke-tests.outputs.platforms) }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - if: runner.os != 'Linux'
        run: rustup toolchain install 1.100.0 --profile minimal

      - if: runner.os == 'Linux'
        run: docker buildx build --target rust-linux-standalone --output type=local,dest=rust/target/release .
      - if: runner.os != 'Linux'
        run: cargo +1.100.0 build --manifest-path rust/Cargo.toml --locked --release -p inpx-server

      - name: Build the standalone Rust application
        env:
          INPX_BUILD_DIST_DIR: ${{ runner.temp }}/inpx-rust-release
        run: npm run build:rust -- ${{ matrix.target }}

      - name: Install Inno Setup
        if: matrix.target == 'win'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Bundle Windows cover tools
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/win | Out-Null
          ./scripts/bundle-windows-tools.ps1

      - name: Bundle fb2cng converter
        if: matrix.target != 'win'
        shell: pwsh
        run: |
          $binDir = Join-Path $PWD "dist/${{ matrix.target }}/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $fbcUrl = "https://github.com/rupor-github/fb2cng/releases/download/$env:FB2CNG_VERSION/${{ matrix.fbc_asset }}"
          $fbcArchive = Join-Path $env:RUNNER_TEMP "${{ matrix.fbc_asset }}"
          $fbcExtract = Join-Path $env:RUNNER_TEMP "fb2cng-${{ matrix.target }}"
          if (Test-Path $fbcExtract) {
            Remove-Item $fbcExtract -Recurse -Force
          }

          Invoke-WebRequest -Uri $fbcUrl -OutFile $fbcArchive
          $actual = (Get-FileHash -Path $fbcArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.fbc_sha256 }}') {
            throw "SHA-256 mismatch for $fbcUrl : expected ${{ matrix.fbc_sha256 }}, got $actual"
          }
          Expand-Archive -Path $fbcArchive -DestinationPath $fbcExtract -Force

          $fbcFileName = 'fbc'
          $fbcSource = Get-ChildItem -Path $fbcExtract -Recurse -File |
            Where-Object { $_.Name -eq $fbcFileName } |
            Select-Object -First 1
          if (-not $fbcSource) {
            throw "Unable to find $fbcFileName in ${{ matrix.fbc_asset }}"
          }

          $fbcTarget = Join-Path $binDir $fbcFileName
          Copy-Item $fbcSource.FullName -Destination $fbcTarget -Force
          chmod +x $fbcTarget

      - name: Bundle pinned Kindling converter
        run: node scripts/bundle-kindling.js ${{ matrix.target }}

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lzip

      - name: Set up MSBuild for MuPDF
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Stage the Windows Rust converters and Visual C++ runtime
        if: matrix.target == 'win'
        shell: pwsh
        run: ./scripts/stage-rust-windows-tools.ps1 -ApplicationDir "${{ runner.temp }}/inpx-rust-release/win" -ToolsDir dist/win/bin

      - name: Include book converters in the Linux and macOS Rust archives
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dist/${{ matrix.target }}/bin
        run: cp fbc kindling LICENSE.kindling "${{ runner.temp }}/inpx-rust-release/${{ matrix.target }}/bin/"

      - name: Verify the standalone Rust archive on this target
        shell: bash
        env:
          INPX_BUILD_DIST_DIR: ${{ runner.temp }}/inpx-rust-release
          INPX_SMOKE_EPUB: 'true'
        run: |
          node build/release.js ${{ matrix.target }}
          version=$(node -p "require('./package.json').version")
          archive="$INPX_BUILD_DIST_DIR/release/inpx-web-$version-${{ matrix.target }}.zip"
          node scripts/release-archive-smoke-test.js ${{ matrix.target }} "$archive" --rust

      - name: Build and test the full Rust Windows installer
        if: matrix.target == 'win'
        shell: pwsh
        env:
          INPX_BUILD_DIST_DIR: ${{ runner.temp }}/inpx-rust-release
        run: |
          node build/windows-installer.js --rust
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = (Get-Item "$env:INPX_BUILD_DIST_DIR/release/*-win-rust-setup.exe").FullName
          ./scripts/test-rust-windows-installer.ps1 -Installer $setup

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/inpx-rust-release/release/*
          if-no-files-found: error

  release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.windows_only }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --dir release-assets

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify the final release assets before publication
        run: |
          npm ci --ignore-scripts
          node scripts/check-release-assets.js release-assets

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tag = process.env.RELEASE_TAG || '';
          const version = tag.replace(/^v/, '');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
          const lines = text.split('\n');
          const start = lines.findIndex(line => line.startsWith(`${version} / `));
          let body = '';

          if (start >= 0) {
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i++) {
              if (/^\d+\.\d+\.\d+(?:[-.][^\s/]+)?\s+\//.test(lines[i])) {
                end = i;
                break;
              }
            }
            body = lines.slice(start, end).join('\n').trim();
          }

          fs.writeFileSync('release-notes.md', `${body || `Release ${tag}`}\n`);
          NODE

      - name: Publish to GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-rc') }}
          body_path: release-notes.md
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
          overwrite_files: true
