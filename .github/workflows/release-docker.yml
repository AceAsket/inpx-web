name: Release Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        default: v1.8.1-rc.6
      metadata_only:
        description: Update Docker Hub description without rebuilding images
        type: boolean
        default: false
      cleanup_old_rc:
        description: Delete old RC tags, keeping the two latest RC versions and all stable tags
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.metadata_only
    name: Build, test and publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            target: runtime
            suffix: ''
          - component: silero
            context: tts/silero
            target: ''
            suffix: -silero
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm run test:release
      - run: npm run test:tts
      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}` || !/^\d+\.\d+\.\d+(?:-rc\.\d+)?$/.test(version)) {
            throw new Error('Tag and package version must match');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=aceasket/inpx-web-7z:${version}${process.env.SUFFIX}\n`);
          NODE
      - name: Build image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          CONTEXT: ${{ matrix.context }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker build "${args[@]}" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" "$CONTEXT"
      - name: Test packaged web application
        if: matrix.component == 'web'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: node scripts/binary-smoke-test.js --image "$IMAGE"
      - name: Test image fb2cng and MOBI conversion
        if: matrix.component == 'web'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: bash scripts/test-image-converters.sh "$IMAGE"
      - name: Test Silero text preparation and real audio
        if: matrix.component == 'silero'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker run --rm -v "$PWD/tts/silero/test_server.py:/app/test_server.py:ro" "$IMAGE" python -m unittest -v test_server
          docker run -d --name silero-test -p 127.0.0.1:18080:8000 -v "$RUNNER_TEMP/inpx-silero-models:/models" "$IMAGE"
          trap 'docker logs silero-test; docker rm -f silero-test' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 2
          done
          node scripts/reader-speech-tests.js --silero-url http://127.0.0.1:18080
          docker stop silero-test
          docker rm silero-test
          docker run -d --name silero-test -p 127.0.0.1:18080:8000 -e SILERO_STRESS_ENABLED=false -v "$RUNNER_TEMP/inpx-silero-models:/models" "$IMAGE"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 2
          done
          node scripts/reader-speech-tests.js --silero-url http://127.0.0.1:18080
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: docker push "$IMAGE"

  promote-stable:
    name: Promote stable image to latest
    needs: publish
    if: (github.event_name != 'workflow_dispatch' || !inputs.metadata_only) && !contains(github.event.inputs.tag || github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested stable image as latest
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker pull "aceasket/inpx-web-7z:$version"
          docker tag "aceasket/inpx-web-7z:$version" aceasket/inpx-web-7z:latest
          docker push aceasket/inpx-web-7z:latest

  metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.metadata_only
    name: Update Docker Hub description and optional RC cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify cleanup selection and description
        run: node scripts/dockerhub-maintenance-tests.js
      - name: Update description and optionally delete old RC tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CLEANUP_OLD_RC: ${{ inputs.cleanup_old_rc }}
        run: node scripts/dockerhub-maintenance.js
      - name: Save original description and tag digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-metadata-backup
          path: dockerhub-backup.json
          retention-days: 30
