plugins { id 'com.android.library' }

def reader = file(providers.gradleProperty('inpxReaderSource').get())
if (!new File(reader, 'app/src/main/java/ru/inpx/reader/ReaderApplication.java').isFile())
    throw new GradleException('Prepare the reader sources with scripts/android/prepare-reader.js')

android {
    namespace 'ru.inpx.reader'
    compileSdk 36
    defaultConfig {
        minSdk 28
        buildConfigField 'boolean', 'EMBEDDED', 'true'
        buildConfigField 'String', 'VERSION_NAME', '"0.17.4"'
        buildConfigField 'int', 'VERSION_CODE', '50'
    }
    sourceSets.main {
        java.srcDirs = [new File(reader, 'app/src/main/java')]
        res.srcDirs = [new File(reader, 'app/src/main/res')]
        resources.srcDirs = [new File(reader, 'app/src/main/resources')]
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
